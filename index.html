<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon épargne</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f9d6b">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7280;--ac:#0f9d6b;--rd:#d64545;--bd:#e3e6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#98a0b3;--ac:#3ccf91;--rd:#ff7b7b;--bd:#2a3145;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#98a0b3;--ac:#3ccf91;--rd:#ff7b7b;--bd:#2a3145;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 16px}
.entete{display:flex;justify-content:space-between;align-items:center;gap:8px}
.entete button{flex:none;padding:8px 12px;font-size:.9rem}
.petit{flex:1;padding:10px 4px;font-size:.8rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.solde{font-size:2rem;font-weight:700;color:var(--ac)}
.mu{color:var(--mu);font-size:.85rem}
input{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem}
.row{display:flex;gap:8px;align-items:center}
button{flex:1;padding:12px;border:0;border-radius:10px;font-size:1rem;font-weight:600;color:#fff;background:var(--ac);cursor:pointer}
.coffre{border-left:6px solid;padding-left:12px}
.head.clic{cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:baseline}
.pct{font-size:.8rem;font-weight:700;padding:2px 8px;border-radius:20px;color:#fff}
.montant{font-size:1.3rem;font-weight:700}
.body{margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
ul{list-style:none;padding:0;margin:8px 0 0}
li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:8px}
li:last-child{border:0}
.pos{color:var(--ac);font-weight:600}
.x{background:none;color:var(--mu);flex:none;padding:4px 8px}
.tot{display:flex;justify-content:space-between;margin-top:10px;font-weight:700}
input.chk{width:22px;height:22px;flex:none;margin:0}
.fait{text-decoration:line-through;color:var(--mu)}
label.row{cursor:pointer}
.ok{color:var(--ac);font-size:.9rem;margin-top:4px}
.ko{color:var(--rd);font-size:.9rem;margin-top:4px}
#msg{color:var(--rd);font-size:.9rem;min-height:1.2em}
select{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem}
.sep{display:flex;align-items:center;gap:10px;margin:22px 0 14px;color:var(--mu);font-size:.8rem}
.sep::before,.sep::after{content:"";flex:1;border-top:2px dashed var(--bd)}
.cols{display:grid;grid-template-columns:1fr;gap:0 16px;align-items:start}

.calnav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calnav .x{font-size:1.4rem;color:var(--tx)}
.grille{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.jn{color:var(--mu);font-size:.75rem;font-weight:700}
.jour{padding:8px 0;border:2px solid transparent;border-radius:8px;cursor:pointer;font-size:.9rem}
.jour.dep{text-decoration:underline;font-weight:700}
.jour.cj{background:var(--ac);color:#fff;font-weight:700}
.jour.pj{border:2px dashed var(--ac);color:var(--ac);font-weight:700}
.jour.auj{outline:2px solid var(--tx)}
.jour.sel{box-shadow:0 0 0 2px var(--rd)}
</style>
</head>
<body>
<main>
<div class="entete"><h1>💰 Mon épargne</h1><button id="sauv">💾 Sauvegarder</button></div>
<div class="mu" id="sauvinfo" style="text-align:right;margin:-8px 0 12px"></div>
<div class="cols"><div>

<div class="card">
  <div class="mu">Total de mes coffres</div>
  <div class="solde" id="total">0</div>
</div>

<div id="coffres"></div>

<div class="card">
  <strong>Ajouter un dépôt</strong>
  <input id="montant" type="number" inputmode="decimal" min="0" placeholder="Montant">
  <div class="row"><button id="dep" class="petit">+ Dépôt</button><button id="reset" class="petit">↺ Remise à 0</button><button id="modbtn" class="petit">✎ Modifier dépôt</button></div>
  <div id="modmsg" class="mu" style="color:var(--rd);margin-top:6px"></div>
  <div id="modpanel" style="display:none;margin-top:8px">
    <select id="modsel"></select>
    <input id="modmontant" type="number" inputmode="decimal" min="0" placeholder="Nouveau montant">
    <div class="row"><button id="modok">Valider</button><button id="modno" style="background:var(--mu)">Annuler</button></div>
  </div>
  <div class="sep">✦</div>
  <div class="row"><button id="calbtn" class="petit" style="background:var(--mu)">📅 Calendrier ▾</button><button id="histbtn" class="petit" style="background:var(--mu)">📜 Historique ▾</button></div>
  <div id="calbox" style="display:none;margin-top:10px">
    <div id="cal"></div>
    <div class="mu" style="margin-top:6px">Touche un jour pour le cocher (jour passé ou à venir). Touche encore pour décocher.</div>
  </div>
  
  <div id="histbox" style="display:none;margin-top:10px"><ul id="liste"></ul></div>
  <div class="mu">Le dépôt est réparti automatiquement : 45 % besoins, 25 % envies, 30 % épargne.</div>
  <div id="msg"></div>
</div>
</div><div>



</div></div>
</main>

<script>
var DEF=[
 {id:"besoins",nom:"Coffre besoins",pct:45,solde:0,c:"#f59e0b",titre:"Liste des besoins",ph:"Nom du besoin (ex : cahier)"},
 {id:"envies",nom:"Coffre envies",pct:25,solde:0,c:"#a855f7",titre:"Liste des envies",ph:"Nom de l’envie (ex : chaussures)"},
 {id:"epargne",nom:"Coffre épargne",pct:30,solde:0,c:"#0f9d6b"}];
var S={coffres:JSON.parse(JSON.stringify(DEF)),ops:[],devise:"FCFA",jours:{},listes:{besoins:[],envies:[]}};
var ouvert=null,alerte="";
function load(){try{var d=localStorage.getItem("mon-epargne-v3");if(d)S=Object.assign(S,JSON.parse(d));S.coffres.forEach(function(c,i){c.pct=DEF[i].pct;c.titre=DEF[i].titre;c.ph=DEF[i].ph;});}catch(e){}}
function save(){try{localStorage.setItem("mon-epargne-v3",JSON.stringify(S));}catch(e){}}
function fmt(n){return n.toLocaleString("fr-FR",{maximumFractionDigits:2})+" "+S.devise;}
function $(i){return document.getElementById(i);}
function esc(t){return String(t).replace(/[<>&]/g,"");}
function byId(id){return S.coffres.filter(function(c){return c.id===id;})[0];}

function totalListe(id){return S.listes[id].reduce(function(a,i){return a+i.p;},0);}
function resteListe(id){return S.listes[id].reduce(function(a,i){return a+(i.ok?0:i.p);},0);}
function corps(c){
  var id=c.id,items=S.listes[id],tot=resteListe(id);
  var h='<div class="body"><strong>'+c.titre+'</strong><div class="mu">Coche un article quand tu l’as acheté : son prix est retiré du coffre.</div>'+(alerte?'<div class="ko">'+alerte+'</div>':'');
  h+='<input id="nom-'+id+'" type="text" placeholder="'+c.ph+'"><input id="prix-'+id+'" type="number" inputmode="decimal" min="0" placeholder="Prix">';
  h+='<div class="row"><button class="add" data-id="'+id+'" style="background:'+c.c+'">+ Ajouter à la liste</button></div><ul>';
  if(!items.length)h+='<li class="mu">Liste vide.</li>';
  items.forEach(function(i){
    h+='<li><label class="row" style="flex:1"><input type="checkbox" class="chk" data-id="'+id+'" data-item="'+i.id+'"'+(i.ok?' checked':'')+'><span'+(i.ok?' class="fait"':'')+'>'+esc(i.n)+'</span></label><span class="row"><span class="pos" style="color:'+c.c+'">'+fmt(i.p)+'</span><button class="x del" data-id="'+id+'" data-item="'+i.id+'" title="Supprimer">✕</button></span></li>';
  });
  h+='</ul>';
  if(items.length){
    var diff=c.solde-tot;
    h+='<div class="tot"><span>Prix total de la liste</span><span>'+fmt(totalListe(id))+'</span></div><div class="row mu" style="justify-content:space-between"><span>Déjà satisfait</span><span>'+fmt(totalListe(id)-tot)+'</span></div><div class="row mu" style="justify-content:space-between"><span>Reste à satisfaire</span><span>'+fmt(tot)+'</span></div>';
    h+=diff>=0?'<div class="ok">Ton coffre couvre cette liste ✅ (il restera '+fmt(diff)+')</div>':'<div class="ko">Il te manque '+fmt(-diff)+' pour tout acheter</div>';
  }
  return h+'</div>';
}

var mois=new Date(new Date().getFullYear(),new Date().getMonth(),1),jourSel=null;
var MOIS=["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
function cle(d){return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();}
function renderCal(){
  var an=mois.getFullYear(),mo=mois.getMonth(),par={};
  S.ops.forEach(function(o){var k=cle(new Date(o.id));(par[k]=par[k]||[]).push(o);});
  var prem=(new Date(an,mo,1).getDay()+6)%7,nb=new Date(an,mo+1,0).getDate(),auj=cle(new Date());
  var h='<div class="calnav"><button class="x" data-nav="-1">‹</button><strong>'+MOIS[mo]+' '+an+'</strong><button class="x" data-nav="1">›</button></div><div class="grille">';
  ["L","M","M","J","V","S","D"].forEach(function(l){h+='<div class="jn">'+l+'</div>';});
  for(var i=0;i<prem;i++)h+='<div></div>';
  for(var j=1;j<=nb;j++){
    var k=an+"-"+mo+"-"+j,cl="jour"+(par[k]?" dep":"")+(S.jours[k]?" cj":"")+(k===auj?" auj":"")+(k===jourSel?" sel":"");
    h+='<div class="'+cl+'" data-jour="'+k+'">'+j+'</div>';
  }
  h+='</div>';
  var tot=0,n=0;
  S.ops.forEach(function(o){var d=new Date(o.id);if(d.getFullYear()===an&&d.getMonth()===mo){tot+=o.m;n++;}});
  var nf=0,np=0;Object.keys(S.jours).forEach(function(k){var p=k.split("-");if(+p[0]===an&&+p[1]===mo){nf++;}});
  h+='<div class="mu" style="margin-top:10px">Ce mois-ci : '+nf+' jour(s) coché(s) · '+n+' dépôt(s), '+fmt(tot)+'</div>';
  if(jourSel&&par[jourSel]){h+='<ul>';par[jourSel].forEach(function(o){h+='<li><span>Dépôt</span><span class="pos">+'+fmt(o.m)+'</span></li>';});h+='</ul>';}
  else if(jourSel)h+='<div class="mu" style="margin-top:6px">Aucun dépôt ce jour-là.</div>';
  $("cal").innerHTML=h;
}
var editId=null;
function modifier(o,nm){
  var old=o.m,np=[],reste=nm;
  o.parts.forEach(function(p,i){
    var c=byId(p.id);c.solde=Math.round((c.solde-p.m)*100)/100;
    var v=i===o.parts.length-1?reste:Math.round(p.m/old*nm*100)/100;
    reste=Math.round((reste-v)*100)/100;
    np.push({id:p.id,m:v});
  });
  np.forEach(function(p){var c=byId(p.id);c.solde=Math.round((c.solde+p.m)*100)/100;});
  o.parts=np;o.m=nm;
}
function render(){
  $("total").textContent=fmt(S.coffres.reduce(function(a,c){return a+c.solde;},0));
  var h="";
  S.coffres.forEach(function(c){
    var liste=!!S.listes[c.id];
    h+='<div class="card coffre" style="border-left-color:'+c.c+'"><div class="head'+(liste?' clic" data-toggle="'+c.id:'')+'">';
    h+='<div class="top"><strong>'+c.nom+'</strong><span class="pct" style="background:'+c.c+'">'+c.pct+' %</span></div>';
    h+='<span class="montant">'+fmt(c.solde)+'</span>';
    if(liste)h+='<div class="mu">Prix total de la liste : <b>'+fmt(totalListe(c.id))+'</b> · reste '+fmt(resteListe(c.id))+'</div>';
    if(liste)h+='<div class="mu">'+(ouvert===c.id?'▴ Masquer la liste':'▾ Touche pour voir la liste')+'</div>';
    h+='</div>';
    if(liste&&ouvert===c.id)h+=corps(c);
    h+='</div>';
  });
  $("coffres").innerHTML=h;
  renderCal();
  var ul=$("liste");ul.innerHTML="";
  if(!S.ops.length)ul.innerHTML='<li class="mu">Aucun dépôt pour le moment.</li>';
  S.ops.slice().reverse().forEach(function(o){
    var li=document.createElement("li");
    var g=document.createElement("div");
    g.innerHTML="<div>Dépôt</div>"+'<div class="mu">'+o.d+" — "+o.parts.map(function(p){return byId(p.id).nom.replace("Coffre ","")+" "+fmt(p.m);}).join(" · ")+"</div>";
    var d=document.createElement("div");d.className="row";
    var s=document.createElement("span");s.className="pos";s.textContent="+"+fmt(o.m);
    var x=document.createElement("button");x.className="x";x.textContent="✕";x.title="Supprimer";
    x.onclick=function(){
      
      S.ops=S.ops.filter(function(z){return z.id!==o.id;});save();render();
    };
    var e=document.createElement("button");e.className="x";e.textContent="✎";e.title="Modifier le montant";
    e.onclick=function(){editId=o.id;render();};
    if(editId===o.id){
      var inp=document.createElement("input");inp.type="number";inp.min="0";inp.value=o.m;inp.style.width="110px";
      var ok=document.createElement("button");ok.className="x";ok.textContent="✔";ok.title="Valider";
      ok.onclick=function(){var nm=parseFloat(inp.value);if(!(nm>0))return;modifier(o,nm);editId=null;save();render();};
      var cx=document.createElement("button");cx.className="x";cx.textContent="↩";cx.title="Annuler";
      cx.onclick=function(){editId=null;render();};
      d.appendChild(inp);d.appendChild(ok);d.appendChild(cx);
    } else {d.appendChild(s);d.appendChild(e);d.appendChild(x);}
    li.appendChild(g);li.appendChild(d);ul.appendChild(li);
  });
}

$("coffres").onclick=function(e){
  var b=e.target,hd=b.closest?b.closest(".head"):null;
  if(hd&&hd.getAttribute("data-toggle")){
    var t=hd.getAttribute("data-toggle");ouvert=(ouvert===t?null:t);alerte="";render();return;
  }
  var id=b.getAttribute("data-id");
  if(b.classList.contains("chk")){
    var cid=parseInt(b.getAttribute("data-item"),10),cf=byId(id);
    alerte="";
    S.listes[id].forEach(function(i){
      if(i.id!==cid)return;
      if(b.checked){
        if(cf.solde<i.p){alerte="Solde insuffisant dans le "+cf.nom.toLowerCase()+" pour cet achat.";return;}
        cf.solde=Math.round((cf.solde-i.p)*100)/100;i.ok=true;i.ded=true;
      } else {
        if(i.ded)cf.solde=Math.round((cf.solde+i.p)*100)/100;
        i.ok=false;i.ded=false;
      }
    });
    save();render();
  } else if(b.classList.contains("add")){
    var n=$("nom-"+id).value.trim(),p=parseFloat($("prix-"+id).value);
    if(!n||!(p>=0))return;
    S.listes[id].push({id:Date.now(),n:n,p:p});save();render();
  } else if(b.classList.contains("del")){
    var iid=parseInt(b.getAttribute("data-item"),10);
    S.listes[id]=S.listes[id].filter(function(i){return i.id!==iid;});save();render();
  }
};

$("dep").onclick=function(){
  var m=parseFloat($("montant").value);
  if(!(m>0)){$("msg").textContent="Entre un montant.";return;}
  var parts=[],reste=m;
  S.coffres.forEach(function(c,i){
    var v=i===S.coffres.length-1?reste:Math.round(m*c.pct)/100;
    reste=Math.round((reste-v)*100)/100;
    parts.push({id:c.id,m:v});c.solde+=v;
  });
  S.ops.push({id:Date.now(),m:m,parts:parts,d:new Date().toLocaleDateString("fr-FR")});
  $("montant").value="";$("msg").textContent="";save();render();
};
var rzTimer=null;
$("reset").onclick=function(){
  var b=this;
  if(b.getAttribute("data-conf")!=="1"){
    b.setAttribute("data-conf","1");b.textContent="⚠️ Confirmer ?";
    rzTimer=setTimeout(function(){b.removeAttribute("data-conf");b.textContent="↺ Remise à 0";},4000);
    return;
  }
  clearTimeout(rzTimer);b.removeAttribute("data-conf");b.textContent="↺ Remise à 0";
  S.coffres.forEach(function(c){c.solde=0;});S.ops=[];editId=null;
  save();render();
};
function majSel(){
  var s=$("modsel");s.innerHTML="";
  S.ops.slice().reverse().forEach(function(o){var op=document.createElement("option");op.value=o.id;op.textContent=o.d+" — "+fmt(o.m);s.appendChild(op);});
}
$("modbtn").onclick=function(){
  $("modmsg").textContent="";
  if(!S.ops.length){$("modmsg").textContent="Aucun dépôt dans l’historique à modifier. Fais d’abord un dépôt avec « + Dépôt ».";return;}
  majSel();
  $("modmontant").value=S.ops[S.ops.length-1].m;
  $("modpanel").style.display="block";
};
$("modsel").onchange=function(){
  var id=parseInt(this.value,10),o=S.ops.filter(function(z){return z.id===id;})[0];
  if(o)$("modmontant").value=o.m;
};
$("modno").onclick=function(){$("modpanel").style.display="none";};
$("modok").onclick=function(){
  var id=parseInt($("modsel").value,10),nm=parseFloat($("modmontant").value),o=S.ops.filter(function(z){return z.id===id;})[0];
  if(!o||!(nm>0)){$("modmsg").textContent="Entre un nouveau montant.";return;}
  modifier(o,nm);$("modpanel").style.display="none";$("modmsg").textContent="";save();render();
};
function infoSauv(){var t=S.derniereSauv;$("sauvinfo").textContent=t?"Dernière sauvegarde : "+t:"";}
$("sauv").onclick=function(){
  var b=this;
  S.derniereSauv=new Date().toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  try{localStorage.setItem("mon-epargne-v3",JSON.stringify(S));b.textContent="✅ Sauvegardé";infoSauv();}catch(e){b.textContent="⚠️ Échec";}
  setTimeout(function(){b.textContent="💾 Sauvegarder";},1500);
};
$("histbtn").onclick=function(){
  var b=$("histbox"),ouv=b.style.display==="none";
  b.style.display=ouv?"block":"none";
  this.textContent=ouv?"📜 Historique ▴":"📜 Historique ▾";
};
$("calbtn").onclick=function(){
  var b=$("calbox"),ouv=b.style.display==="none";
  b.style.display=ouv?"block":"none";
  this.textContent=ouv?"📅 Calendrier ▴":"📅 Calendrier ▾";
};
$("cal").onclick=function(e){
  var b=e.target,nv=b.getAttribute("data-nav"),jr=b.getAttribute("data-jour");
  if(nv){mois=new Date(mois.getFullYear(),mois.getMonth()+parseInt(nv,10),1);jourSel=null;renderCal();}
  else if(jr){
    if(S.jours[jr])delete S.jours[jr];else S.jours[jr]="fait";
    save();renderCal();
  }
};
load();render();infoSauv();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");}catch(e){}
</script>
</body>
</html>
